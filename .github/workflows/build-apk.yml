
name: Build Study Routine APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check web files
        run: |
          test -f www/index.html
          test -f www/app.js
          echo "Checking UTF-8 HTML..."
          grep -n 'charset="UTF-8"' www/index.html
          echo "Checking Hindi text..."
          grep -n 'आज की तैयारी' www/index.html
          grep -n 'पूरा' www/app.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify copied HTML
        run: |
          test -f android/app/src/main/assets/public/index.html
          grep -n 'आज की तैयारी' android/app/src/main/assets/public/index.html

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: study-routine-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
